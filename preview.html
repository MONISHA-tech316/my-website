<!DOCTYPE html>
<html>
<head>
    <title>My Home Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #0077cc;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #333;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 18px;
        }

        nav a:hover {
            color: yellow;
        }

        .content {
            text-align: center;
            padding: 60px;
        }

        .content h2 {
            color: #333;
        }

        .content p {
            font-size: 18px;
            color: #666;
        }

        button {
            background-color: #0077cc;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #005fa3;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>

</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">
        <h2>Home Page</h2>
        <p>
            This is a simple homepage created using HTML and CSS.
            It is suitable for beginners learning web development.
        </p>

        <button>Learn More</button>
    </div>

    <footer>
        © 2026 My Website | All Rights Reserved
    </footer>

</body>
</html>
